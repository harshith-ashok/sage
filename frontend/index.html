<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SAGE</title>
    <script>
      // Applied before Vue mounts so there's no flash of the wrong theme on
      // load — same persisted choice src/lib/theme.ts's useTheme() reads
      // and writes at runtime, duplicated here only because this has to run
      // before any CSS paints, which is earlier than any Vue code can.
      (function () {
        try {
          var saved = localStorage.getItem("sage-theme");
          var theme = saved === "light" || saved === "dark" ? saved : window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
          document.documentElement.setAttribute("data-theme", theme);
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
